worker_processes 1;

pid /home/rubi/cloud-engineering/nginx-lab/logs/nginx.pid;

error_log /home/rubi/cloud-engineering/nginx-lab/logs/error.log;

events {
    worker_connections 128;
}

http {
    access_log /home/rubi/cloud-engineering/nginx-lab/logs/access.log;

    server {
        listen 127.0.0.1:8081;

        server_name localhost;

        root /home/rubi/cloud-engineering/nginx-lab/html;

        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
